<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surpweb | Ultra-Elite Birthday 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink: #ff2d75;
            --soft-pink: #ff85af;
            --gold: #ffcc00;
            --dark-bg: #0a0612;
            --neon-glow: 0 0 30px rgba(255, 45, 117, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0a0612 100%);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            color: white;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        /* --- Music Toggle Button --- */
        #music-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 4000;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 1.1rem; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #music-toggle:hover { background: var(--pink); border-color: var(--pink); transform: scale(1.1); }

        /* --- Elite Login Page --- */
        #login-overlay {
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, rgba(26, 11, 46, 0.8) 0%, #0a0612 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 3000; transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 50px 40px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 85%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            animation: boxFloat 4s ease-in-out infinite;
        }

        @keyframes boxFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-box h2 { 
            font-family: 'Dancing Script'; 
            font-size: 3rem; 
            margin-bottom: 30px; 
            background: linear-gradient(to bottom, #fff, var(--soft-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 133, 175, 0.3));
        }

        .input-group { position: relative; margin-bottom: 20px; }

        .login-box input {
            width: 100%;
            padding: 15px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: white;
            text-align: center;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: 0.3s;
            outline: none;
        }

        .login-box input:focus {
            border-bottom: 1px solid var(--pink);
            box-shadow: 0 10px 10px -10px var(--pink);
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(255,255,255,0.4);
            transition: 0.3s;
            z-index: 10;
        }
        .toggle-password:hover { color: var(--pink); }

        .login-box input::placeholder {
            color: rgba(255,255,255,0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-elite {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, #ff2d75, #ff85af, #ff2d75);
            background-size: 200% auto;
            color: white;
            font-weight: 900;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(255, 45, 117, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-elite:hover {
            background-position: right center;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 45, 117, 0.6), 0 0 20px rgba(255, 45, 117, 0.4);
            letter-spacing: 4px;
        }

        /* --- Countdown --- */
        #countdown-wrap {
            position: fixed; inset: 0;
            display: none; align-items: center; justify-content: center;
            z-index: 2000; background: var(--dark-bg);
        }

        .num {
            font-size: 18rem; font-weight: 900; color: white;
            text-shadow: var(--neon-glow);
            position: absolute;
            animation: cinematicPulse 1s ease-out forwards;
        }

        @keyframes cinematicPulse {
            0% { transform: scale(0.5); opacity: 0; filter: blur(20px); }
            50% { transform: scale(1.1); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1.5); opacity: 0; filter: blur(10px); }
        }

        /* --- Main Stage --- */
        #main-stage {
            position: relative; z-index: 100;
            display: none; text-align: center; opacity: 0;
            perspective: 2000px;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 60px 40px; border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 50px 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            max-width: 500px; width: 90%;
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
        }

        .bday-text {
            font-family: 'Dancing Script', cursive; font-size: 3.5rem;
            background: linear-gradient(to right, #fff, var(--pink), var(--soft-pink));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin: 10px 0; filter: drop-shadow(0 0 10px rgba(255, 45, 117, 0.5));
            transform: translateZ(50px);
        }

        .btn-luxury {
            margin-top: 30px; padding: 18px 45px;
            background: linear-gradient(45deg, var(--pink), #ff5e95);
            color: white; border: none; border-radius: 50px;
            font-size: 0.9rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(255, 45, 117, 0.4);
            transform: translateZ(30px);
        }

        .btn-luxury:hover {
            transform: translateZ(60px) translateY(-8px) scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 45, 117, 0.7), 0 0 15px rgba(255, 255, 255, 0.2);
            filter: brightness(1.1);
        }

        /* --- Balloons & Rest --- */
        #gallery-stage {
            position: fixed; inset: 0; z-index: 500;
            display: none; flex-direction: column; 
            align-items: center; justify-content: center; 
            opacity: 0; background: rgba(10, 6, 18, 0.95);
            text-align: center;
        }

        #pop-instruction {
          font-family: 'Dancing Script'; font-size: 2.5rem; 
          margin-bottom: 50px; 
          visibility: hidden; opacity: 0; transition: opacity 0.5s;
          width: 100%;
        }

        .balloon-grid { 
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 30px; 
            max-width: 600px;
            width: 100%;
            justify-items: center;
            align-items: center;
        }

        .balloon:nth-child(1) { grid-column: 1 / span 2; }
        .balloon:nth-child(2) { grid-column: 3 / span 2; }
        .balloon:nth-child(3) { grid-column: 5 / span 2; }
        .balloon:nth-child(4) { grid-column: 2 / span 2; grid-row: 2; }
        .balloon:nth-child(5) { grid-column: 4 / span 2; grid-row: 2; }

        .balloon {
            width: 85px; height: 105px; border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            position: relative; cursor: pointer;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.2) 20%, transparent 50%),
                        radial-gradient(circle at 50% 50%, var(--balloon-color, #ff2d75) 0%, #000 150%);
            box-shadow: inset -5px -10px 20px rgba(0,0,0,0.3), 0 15px 25px rgba(0,0,0,0.4);
            animation: floatSway 4s ease-in-out infinite alternate;
            transition: transform 0.2s, visibility 0.2s;
        }

        .balloon::before {
            content: ""; position: absolute; bottom: -6px; left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 12px solid var(--balloon-color, #ff2d75);
            filter: brightness(0.8);
        }

        @keyframes floatSway {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-20px) translateX(5px) rotate(3deg); }
        }

        #mega-container {
            position: relative; 
            margin-top: 50px;
            display: none; justify-content: center; align-items: center; z-index: 600;
        }

        .mega-balloon {
            width: 150px; height: 180px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.2) 20%, transparent 50%),
                        radial-gradient(circle at 50% 50%, #ffcc00 0%, #b8860b 120%);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            cursor: pointer; box-shadow: 0 0 60px rgba(255, 204, 0, 0.6), inset -10px -15px 30px rgba(0,0,0,0.3);
            animation: floatSway 3s ease-in-out infinite alternate;
        }

        .floating-polaroid {
            position: fixed; background: white; padding: 8px; padding-bottom: 12px;
            width: auto; max-width: 140px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000; cursor: pointer; display: none; border-radius: 4px;
            opacity: 0;
        }
        .floating-polaroid img { display: block; width: 100%; height: auto; max-height: 150px; object-fit: contain; border-radius: 2px; }
        .pol-design-cap { font-family: 'Dancing Script', cursive; color: #444; font-size: 1rem; text-align: center; margin-top: 6px; }

        @keyframes polFadeIn {
            0% { opacity: 0; transform: translateY(50px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(var(--pol-rotation)); }
        }

        #letter-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px); z-index: 5000;
            display: none; align-items: center; justify-content: center;
        }

        .letter-paper {
            width: 85%; max-width: 450px; background: #fffaf0; 
            padding: 40px; border-radius: 5px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative; transform: translateY(100vh); transition: 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #333; line-height: 1.6;
            max-height: 70vh; overflow-y: auto;
        }

        .letter-paper::-webkit-scrollbar { width: 6px; }
        .letter-paper::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        .letter-paper::-webkit-scrollbar-thumb { background: var(--soft-pink); border-radius: 10px; }

        .letter-paper.open { transform: translateY(0); }

        #typewriter-text {
            font-family: 'Dancing Script', cursive; font-size: 1.5rem;
            min-height: 250px; white-space: pre-wrap; color: #2c3e50;
        }

        .letter-close {
            position: absolute; top: 10px; right: 15px; font-size: 1.5rem;
            cursor: pointer; color: var(--pink); z-index: 10;
        }

        .letter-skip {
            position: absolute; bottom: 12px; left: 40px; font-size: 0.75rem;
            font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; color: #7f8c8d; transition: color 0.3s; z-index: 10;
        }
        .letter-skip:hover { color: var(--pink); }

        #love-letter-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) scale(0);
            z-index: 1500; display: none; transition: 0.5s; opacity: 0;
        }
        #love-letter-btn.show { display: block; transform: translateX(-50%) scale(1); opacity: 1; }

        #photo-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 6000; display: none; align-items: center; justify-content: center;
        }
        .polaroid-frame {
            background: white; padding: 15px; padding-bottom: 50px;
            transform: rotate(-3deg) scale(0.8); transition: 0.5s;
            box-shadow: 0 50px 100px rgba(0,0,0,1);
            max-width: 90vw; max-height: 85vh; display: flex; flex-direction: column; align-items: center;
        }
        #photo-overlay.active .polaroid-frame { transform: rotate(0deg) scale(1); }
        .polaroid-frame img { display: block; width: auto; height: auto; max-width: 80vw; max-height: 65vh; object-fit: contain; }

        #login-error { 
            color: var(--pink); 
            font-size: 0.85rem; 
            margin-top: 15px; 
            font-weight: 600;
            display: none;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media screen and (max-width: 480px) {
            .login-box { padding: 40px 25px; border-radius: 30px; }
            .login-box h2 { font-size: 2.2rem; }
            .num { font-size: 10rem; }
            .bday-text { font-size: 2.2rem; }
            .glass-card { padding: 40px 20px; border-radius: 30px; }
            .balloon-grid { gap: 15px; max-width: 320px; padding: 0 10px; }
            .balloon { width: 70px; height: 90px; }
            .mega-balloon { width: 120px; height: 150px; }
            .floating-polaroid { max-width: 110px; padding: 6px; }
            .floating-polaroid img { max-height: 120px; }
            .pol-design-cap { font-size: 0.8rem; }
            .letter-paper { padding: 25px; width: 90%; max-height: 65vh; }
            #typewriter-text { font-size: 1.1rem; min-height: 200px; }
            .btn-luxury { padding: 15px 30px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Background Audio Element (Loads from assets/ folder) -->
    <audio id="bg-music" loop>
        <source src="assets/bgm-1.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Control Toggle Button -->
    <div id="music-toggle" onclick="toggleMusic()" title="Toggle Background Music">
        <i class="fa-solid fa-music" id="music-icon"></i>
    </div>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Heyy  pondatti ✨</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Identify yourself" autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Access Code">
                <i class="fa-solid fa-eye toggle-password" id="togglePass" onclick="togglePasswordVisibility()"></i>
            </div>
            <button class="btn-elite" onclick="checkLogin()">UNLOCK THE MAGIC</button>
            <p id="login-error">ACCESS DENIED THANGOO ❌</p>
        </div>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div id="countdown-wrap"></div>

    <div id="main-stage">
        <div class="glass-card" id="tilt-card">
            <p style="font-family: 'Dancing Script'; font-size: 1.4rem; color: var(--soft-pink); margin-bottom: 0;">
                "Aayiram pookkal malarnthalum..."
            </p>
            <p style="font-family: 'Dancing Script'; font-size: 1.4rem; color: var(--soft-pink); margin-top: 5px;">
                "Un sirippuku eedu illai!" 🌸
            </p>

            <h1 class="bday-text"> Happy birthday pondatti 💋💖</h1>
            <p style="opacity: 0.6; margin-top: 20px; letter-spacing: 2px; font-size: 0.8rem;"> Unaku ethu pudikum !!❤️</p>
            <button class="btn-luxury" onclick="showBalloonsPage()">Enter Love World ✨</button>
        </div>
    </div>

    <div id="gallery-stage">
        <h2 id="pop-instruction">Pop for a surprise! 🎈</h2>
        <div class="balloon-grid" id="balloon-box"></div>
        <div id="mega-container">
            <div class="mega-balloon" onclick="popMega(this)"></div>
        </div>
    </div>

    <div id="letter-overlay">
        <div class="letter-paper" id="letter-paper">
            <span class="letter-close" onclick="closeLetter()">×</span>
            <span class="letter-skip" id="skipBtn" onclick="skipTypewriter()">Skip ▸▸</span>
            <div id="typewriter-text"></div>
            <div style="text-align: right; margin-top: 20px; font-family: 'Dancing Script'; font-size: 1.4rem;">
              Eppadiku !
<br>  Anirudh 
            </div>
        </div>
    </div>

    <button class="btn-luxury" id="love-letter-btn" onclick="openLoveLetter()">Open My Words💌</button>

    <div id="photo-overlay" onclick="this.classList.remove('active'); setTimeout(()=>this.style.display='none', 500)">
        <div class="polaroid-frame">
            <img id="popup-img" src="" alt="">
            <div id="popup-text" style="color: #222; text-align: center; font-family: 'Dancing Script'; font-size: 1.5rem; margin-top: 10px;">Forever & Always ❤️</div>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bg-music');
        const musicIcon = document.getElementById('music-icon');
        let isMusicPlaying = false;

        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.classList.remove('fa-volume-high');
                musicIcon.classList.add('fa-music');
                isMusicPlaying = false;
            } else {
                bgMusic.play().then(() => {
                    musicIcon.classList.remove('fa-music');
                    musicIcon.classList.add('fa-volume-high');
                    isMusicPlaying = true;
                }).catch(e => console.log("Audio play blocked or missing file:", e));
            }
        }

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('togglePass');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('login-error');

            if(user === "kokila" && pass === "2013") {
                // Attempt to auto-start music on successful unlock interaction
                bgMusic.play().then(() => {
                    musicIcon.classList.remove('fa-music');
                    musicIcon.classList.add('fa-volume-high');
                    isMusicPlaying = true;
                }).catch(e => console.log("Autoplay restricted:", e));

                document.getElementById('login-overlay').style.opacity = '0';
                document.getElementById('login-overlay').style.transform = 'scale(1.2)';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('countdown-wrap').style.display = 'flex';
                    runTimer();
                }, 800);
            } else {
                error.style.display = 'block';
                setTimeout(() => { error.style.display = 'none'; }, 2000);
            }
        }

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const emojis = ['💖', '❤️', '✨', '🌸', '🥰'];
        let particles = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.text = emojis[Math.floor(Math.random() * emojis.length)];
                this.size = Math.random() * 20 + 15;
                this.speed = Math.random() * 1.5 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.swing = Math.random() * 2;
            }
            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.y / 50) * this.swing;
                if (this.y < -50) this.reset();
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px serif`;
                ctx.fillStyle = "white";
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        for(let i=0; i<40; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

        const card = document.getElementById('tilt-card');
        window.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        const countdown = ['3', '2', '1', '🎂'];
        let idx = 0;
        function runTimer() {
            if(idx < countdown.length) {
                document.getElementById('countdown-wrap').innerHTML = `<div class="num">${countdown[idx]}</div>`;
                idx++;
                setTimeout(runTimer, 1000);
            } else {
                document.getElementById('countdown-wrap').style.display = 'none';
                const main = document.getElementById('main-stage');
                main.style.display = 'block';
                setTimeout(() => main.style.opacity = '1', 50);
                confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
            }
        }

        function showBalloonsPage() {
            document.getElementById('main-stage').style.display = 'none';
            showBalloons();
        }

        const balloonImages = ["assets/img-1.jpg", "assets/img-2.jpg", "assets/img-3.jpg", "assets/img-4.jpg", "assets/img-5.jpg"];
        const cascadeImages = ["assets/img-6.jpg", "assets/img-7.jpg", "assets/img-8.jpg", "assets/img-9.jpg", "assets/img-1.jpg", "assets/img-3.jpg", "assets/img-4.jpg", "assets/img-2.jpg"];
        const colors = ['#ff2d75', '#ff5e95', '#ff85af', '#ffcc00', '#00d2ff'];
        const quotes = ["Always by my side", "Making memories together ✨", "Life's better with you ❤️", "My favorite human 🪄", "You're my person 💎"];
        let balloonsPopped = 0;

        function showBalloons() {
            const gallery = document.getElementById('gallery-stage');
            gallery.style.display = 'flex';
            setTimeout(() => gallery.style.opacity = '1', 50);
            const box = document.getElementById('balloon-box');
            box.innerHTML = ''; 
            for(let i=0; i<5; i++) {
                const b = document.createElement('div');
                b.className = 'balloon';
                b.style.setProperty('--balloon-color', colors[i]);
                b.onclick = () => { b.style.transform = "scale(1.2)"; setTimeout(() => pop(i, b), 100); };
                box.appendChild(b);
            }
            document.getElementById('pop-instruction').style.visibility = 'visible';
            document.getElementById('pop-instruction').style.opacity = '1';
        }

        function pop(i, el) {
            confetti({ particleCount: 50, origin: { x: 0.5, y: 0.5 } });
            el.style.visibility = 'hidden';
            el.style.pointerEvents = 'none';
            balloonsPopped++;
            showPopup(balloonImages[i], quotes[i]);
            if(balloonsPopped === 5) {
                document.getElementById('pop-instruction').innerText = "Pop the big one! 🌟";
                const megaCont = document.getElementById('mega-container');
                megaCont.style.display = 'flex';
                setTimeout(() => { megaCont.style.opacity = '1'; }, 50);
            }
        }

        function popMega(el) {
            confetti({ particleCount: 400, spread: 160, origin: { y: 0.6 }, colors: ['#ffcc00', '#ffffff', '#ff2d75'] });
            el.style.visibility = 'hidden';
            setTimeout(() => {
                document.getElementById('gallery-stage').style.display = 'none';
                spawnCascadePolaroids();
            }, 500);
        }

        let activePolaroids = [];
        let canStartFloating = false;

        function spawnCascadePolaroids() {
            const numPolaroids = cascadeImages.length;
            for (let i = 0; i < numPolaroids; i++) {
                const pol = document.createElement('div');
                pol.className = 'floating-polaroid';
                const finalLeft = `${10 + Math.random() * 70}%`;
                const finalTop = `${10 + Math.random() * 70}%`;
                const randomRotation = (Math.random() - 0.5) * 40;
                pol.style.left = finalLeft;
                pol.style.top = finalTop;
                pol.style.display = 'block';
                pol.style.setProperty('--pol-rotation', `${randomRotation}deg`);
                pol.innerHTML = `<img src="${cascadeImages[i]}"><div class="pol-design-cap"> My happiness ❤️ </div>`;
                pol.onclick = () => showPopup(pol.querySelector('img').src, " It's always you ❤️ "); 
                document.body.appendChild(pol);
                setTimeout(() => { pol.style.animation = `polFadeIn 1s ease-out forwards`; }, i * 250);
                activePolaroids.push({
                    el: pol, x: parseFloat(finalLeft), y: parseFloat(finalTop),
                    vx: (Math.random() - 0.5) * 0.08, vy: (Math.random() - 0.5) * 0.08,
                    rotation: randomRotation, vr: (Math.random() - 0.5) * 0.02
                });
            }
            setTimeout(() => {
                canStartFloating = true;
                updatePolaroids();
                document.getElementById('love-letter-btn').classList.add('show');
            }, (numPolaroids * 250) + 1000); 
        }

        function updatePolaroids() {
            if (!canStartFloating) return;
            activePolaroids.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.rotation += p.vr;
                if (p.x < 5 || p.x > 85) p.vx *= -1;
                if (p.y < 5 || p.y > 85) p.vy *= -1;
                p.el.style.left = `${p.x}%`; p.el.style.top = `${p.y}%`;
                p.el.style.transform = `rotate(${p.rotation}deg)`;
            });
            requestAnimationFrame(updatePolaroids);
        }

        let typewriterTimeout;
        let isTyping = false;

        function openLoveLetter() {
            const overlay = document.getElementById('letter-overlay');
            const paper = document.getElementById('letter-paper');
            const textEl = document.getElementById('typewriter-text');
            const skipBtn = document.getElementById('skipBtn');
            overlay.style.display = 'flex';
            textEl.innerHTML = ""; 
            skipBtn.style.display = "block";
            setTimeout(() => {
                paper.classList.add('open');
                isTyping = true;
                setTimeout(() => typeWriter(letterMessage, 0, textEl), 1000);
            }, 50);
        }

        function typeWriter(text, i, element) {
            if (!isTyping) return;
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                const paper = document.getElementById('letter-paper');
                paper.scrollTop = paper.scrollHeight;
                typewriterTimeout = setTimeout(() => typeWriter(text, i + 1, element), 50);
            } else {
                isTyping = false;
                document.getElementById('skipBtn').style.display = "none";
            }
        }

        function skipTypewriter() {
            isTyping = false;
            clearTimeout(typewriterTimeout);
            document.getElementById('typewriter-text').innerHTML = letterMessage;
            document.getElementById('skipBtn').style.display = "none";
            const paper = document.getElementById('letter-paper');
            paper.scrollTop = 0;
        }

        function closeLetter() {
            isTyping = false;
            clearTimeout(typewriterTimeout);
            document.getElementById('letter-paper').classList.remove('open');
            setTimeout(() => document.getElementById('letter-overlay').style.display = 'none', 800);
        }

        function showPopup(img, text) {
            const overlay = document.getElementById('photo-overlay');
            document.getElementById('popup-img').src = img;
            document.getElementById('popup-text').innerText = text;
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 50);
